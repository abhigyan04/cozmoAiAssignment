[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floorplan"
version = "0.1.0"
description = "Phone capture (photos, video, LiDAR) to a dimensioned, stitched floor plan with damage assessment"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "open3d",
    "matplotlib",
    "shapely",
    "av",
    "pyyaml",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]